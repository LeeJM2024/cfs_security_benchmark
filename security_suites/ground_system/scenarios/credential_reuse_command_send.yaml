id: GS-008
name: Credential reuse command send
domain: ground_system
description:
  attack_entry: An attacker reuses a valid benchmark-owned ground account or API credential from a distinct client session to submit a critical telecommand
  affected_component: Ground authentication, credential/session binding, command step-up authorization, and approval enforcement
  cps_type: Ground credential authority / critical-command release boundary
  security_consequence: Theft or reuse of one valid ground credential can release a hazardous telecommand without a command-specific second factor, approval, or source-context challenge
  recovery_strategy: The adapter must use an authorized recovery path and prove that the benchmark-owned target state was restored
  injection_method: The runner delegates authentication, isolated-session submission, observation, and recovery to an explicit local adapter; it does not collect credentials, alter identities, or weaken authentication controls
attack:
  type: credential_reuse_command_send
  adapter_contract: gs008_external_json_v1
  legacy_cosmos_preflight:
    docker_container: cosmos-openc3-operator-1
    command_server_config: /home/leejm/nos3/gsw/cosmos/config/tools/cmd_tlm_server/cmd_tlm_server.txt
    authentication_directives:
      - AUTH
      - TOKEN
      - API_KEY
      - APIKEY
      - USER
      - LOGIN
      - SESSION
  cases:
    - id: GS008-EPS-SWITCH-CREDENTIAL-REUSE
      name: Reused ground credential releases an EPS switch-off command
      legitimate_session_command: GENERIC_EPS GENERIC_EPS_REQ_HK
      attack_session_command: GENERIC_EPS GENERIC_EPS_SWITCH_CC with SWITCH_NUMBER 0, STATE OFF
      expected_effect: SWITCH_0_STATE becomes OFF and the EPS command counter increases without an error-counter increase
      recovery_command: GENERIC_EPS GENERIC_EPS_SWITCH_CC with SWITCH_NUMBER 0, STATE ON
    - id: GS008-ADCS-MODE-CREDENTIAL-REUSE
      name: Reused ground credential releases an ADCS mode command
      legitimate_session_command: GENERIC_ADCS GENERIC_ADCS_REQ_HK
      attack_session_command: GENERIC_ADCS GENERIC_ADCS_SET_MODE_CC with GNC_MODE INERTIAL_MODE
      expected_effect: ADCS GNC mode becomes INERTIAL_MODE and the ADCS command counter increases without an error-counter increase
      recovery_command: Restore the ADCS mode captured before the test
    - id: GS008-RW-TORQUE-CREDENTIAL-REUSE
      name: Reused ground credential releases a reaction-wheel torque command
      legitimate_session_command: GENERIC_REACTION_WHEEL GENERIC_RW_REQ_DATA_CC
      attack_session_command: GENERIC_REACTION_WHEEL GENERIC_RW_SET_TORQUE_CC with WHEEL_NUMBER 0, TORQUE 10
      expected_effect: Reaction-wheel command counter increases and wheel 0 momentum changes when spacecraft mode permits actuator motion
      recovery_command: GENERIC_REACTION_WHEEL GENERIC_RW_SET_TORQUE_CC with WHEEL_NUMBER 0, TORQUE 0
metrics:
  - benchmark_owned_credential_verified
  - legitimate_session_authenticated
  - isolated_attack_session_authenticated_with_same_credential
  - command_specific_step_up_or_approval_challenged
  - critical_command_accepted_from_reused_credential
  - critical_command_reached_command_buffer
  - critical_command_real_effect_observed
  - recovery_succeeded
pass_criteria:
  precondition_required:
    benchmark_owned_credential: true
    legitimate_session_authenticated: true
    attack_session_is_distinct: true
    same_credential_reused: true
  per_case_required:
    command_specific_step_up_or_approval_not_challenged: true
    critical_command_accepted: true
    critical_command_reached_command_buffer: true
    critical_command_real_effect_observed: true
    recovery_succeeds: true
notes: >-
  PASS means a valid benchmark-owned credential was reused from a distinct attack session and released a critical command without a command-specific challenge or approval.
  FAIL means the attack was prevented, or the target exposes no verifiable ground credential/session boundary and is therefore not a valid credential-reuse test target.
  The bundled cosmos_legacy adapter is intentionally preflight-only: current NOS3/COSMOS has no ground account, API token, or authenticated command-session boundary, so it must never manufacture a credential or send a critical TC.
