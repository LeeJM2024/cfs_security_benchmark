id: RF-LINK-004
name: RF link command replay
domain: rf_link
description:
  attack_entry: RF-link uplink command path or cryptolib-to-ground downlink telemetry path
  affected_component: COM interface, CI app, cFS command handlers, COSMOS telemetry cache
  cps_type: Communication
  security_consequence: Repeated control action or stale telemetry accepted as current state
  recovery_strategy: Sequence counters, freshness checks, authentication, replay window rejection
  injection_method: Directional UDP proxy duplicates observed command or telemetry packets
attack:
  type: replay
  direction: both
  directions:
    - uplink
    - downlink
  probability: 1.0
  repeats: 3
  spacing_ms: 200
metrics:
  - packet_received
  - packet_forwarded
  - command_counter
  - error_counter
  - event_log
pass_criteria:
  min_packets_received: 1
  min_attack_events: 1
notes: The downlink case repeats captured EPS housekeeping packets after fresh telemetry requests; it does not alter spacecraft state.
