id: RF-LINK-001
name: RF link eavesdropping baseline
domain: rf_link
description:
  attack_entry: RF-link uplink command path or cryptolib-to-ground downlink telemetry path
  affected_component: COM interface, CI/TO link, radio interface
  cps_type: Communication
  security_consequence: Data leak through passive observation of command or telemetry packets
  recovery_strategy: Link encryption, key rotation, traffic minimization, anomaly-aware operations
  injection_method: Directional UDP proxy logs packets and forwards them unchanged
attack:
  type: observe
  direction: both
  directions:
    - uplink
    - downlink
metrics:
  - packet_received
  - packet_forwarded
  - event_log
pass_criteria:
  min_packets_received: 0
  min_attack_events: 0
notes: Each live benchmark records independent uplink and downlink cases. The downlink case requests repeatable EPS housekeeping telemetry.
