id: RF-LINK-003
name: RF link command delay
domain: rf_link
description:
  attack_entry: RF-link uplink command path or cryptolib-to-ground downlink telemetry path
  affected_component: COM interface, TC fetcher, cFS command dispatch, COSMOS telemetry receiver
  cps_type: Communication
  security_consequence: Denial or degradation of timely command control or telemetry awareness
  recovery_strategy: Command timeout, temporal validity checks, operator resynchronization
  injection_method: Directional UDP proxy sleeps before forwarding selected packets
attack:
  type: delay
  direction: both
  directions:
    - uplink
    - downlink
  delay_ms: 2000
metrics:
  - packet_received
  - packet_forwarded
  - command_latency
  - event_log
pass_criteria:
  min_packets_received: 1
  min_attack_events: 0
notes: Uplink delays commands; downlink delays repeatable EPS housekeeping telemetry before COSMOS receives it.
