id: RF-LINK-005
name: RF link bit flip
domain: rf_link
description:
  attack_entry: RF-link / ground-to-space command or downlink telemetry path
  affected_component: COM interface, TC parser, telemetry parser
  cps_type: Communication
  security_consequence: Message integrity violation, malformed telecommand, or misleading telemetry
  recovery_strategy: CRC, authentication tag, parser hardening, reject malformed packets
  injection_method: External host-veth tc pedit mutates protected TCP payload bytes and recomputes the TCP checksum
attack:
  type: bit_flip
  direction: both
  directions:
    - uplink
    - downlink
  offset: -1
  bit: 0
  protected_payload_offset_from_ip: 76
metrics:
  - packet_received
  - packet_forwarded
  - error_counter
  - parser_event_log
pass_criteria:
  min_packets_received: 1
  min_attack_events: 1
notes: The cryptographic-boundary mode changes a protected payload word only on the external host-veth medium. TCP checksum recomputation ensures the altered protected frame reaches the receiving socket for integrity verification.
